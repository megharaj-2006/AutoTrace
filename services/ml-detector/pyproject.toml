[project]
name = "autotrace-ml-detector"
version = "0.2.0"
description = "AutoTrace-Sec ML detector: rogue-edge scoring (/score-edge) and root-cause analysis (/rca)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "numpy>=1.26,<3",
    "networkx>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["src", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
